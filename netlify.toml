"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm run build --workspace=@2ie/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API and uploaded assets through the frontend origin so auth cookies
# remain first-party in the browser. Keep this rule before the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "https://twoie-market-api-il32.onrender.com/:splat"
  status = 200
  force = true

# Les images locales publiques sont servies par le backend.
# Les justificatifs vendeur sont bloqués par l'API et ne sont jamais publics.
[[redirects]]
  from = "/uploads/*"
  to = "https://twoie-market-api-il32.onrender.com/uploads/:splat"
  status = 200
  force = true

# React + TanStack Router: serve index.html for client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers and long-lived caching for fingerprinted Vite assets.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
