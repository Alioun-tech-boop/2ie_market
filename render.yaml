services:
  - type: web
    name: 2ie-market-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build -w @2ie/api
    # Le plan gratuit ne prend pas en charge preDeployCommand. L'instance
    # unique applique donc les migrations avant de démarrer l'API.
    startCommand: npm run prisma:deploy && npm run start -w @2ie/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      # Valeur fournie lors de l'application du Blueprint : URL PostgreSQL
      # du projet Supabase, jamais commise dans ce fichier.
      - key: DATABASE_URL
        sync: false
      # URL de production Vercel, renseignée après la création du frontend.
      - key: FRONTEND_URL
        sync: false
      - key: REVIEWS_ENABLED
        value: "false"
